name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    # Same guard pattern as cd.yml: CI succeeded, same repo, staging branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'staging'
    name: Deploy Staging (Cloudflare)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: staging

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @rnbp/shared build

      - name: Build web (staging)
        env:
          VITE_API_URL: https://badge-api-staging.alexandre-lessard92.workers.dev/api
        run: pnpm --filter @rnbp/web build

      - name: Deploy web to Cloudflare Pages (staging branch)
        run: pnpm --filter @rnbp/web exec wrangler pages deploy build/client --project-name rnbp-platform --branch staging --cwd apps/web

      - name: Apply D1 migrations (staging)
        if: ${{ hashFiles('apps/worker/wrangler.jsonc') != '' }}
        run: pnpm --filter @rnbp/worker exec wrangler d1 migrations apply badge-db-staging --remote --env staging

      - name: Deploy API Worker (staging)
        if: ${{ hashFiles('apps/worker/wrangler.jsonc') != '' }}
        run: pnpm --filter @rnbp/worker exec wrangler deploy --env staging

      - name: Health check staging API
        if: ${{ hashFiles('apps/worker/wrangler.jsonc') != '' }}
        run: |
          for i in 1 2 3 4 5; do
            sleep 3
            if curl -sf https://badge-api-staging.alexandre-lessard92.workers.dev/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying..."
          done
          echo "Health check failed!"
          exit 1
