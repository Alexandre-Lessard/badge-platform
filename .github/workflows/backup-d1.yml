name: Backup D1

# The Postgres backup runs from cron on the old server (ops/backup.sh), which
# disappears once the argon2 migration finishes. D1's backup runs here instead,
# so it outlives that machine. D1 also keeps 30 days of Time Travel on its own;
# this is the off-platform copy, into the same R2 bucket as the Postgres dumps.

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 America/Toronto (EDT)
  workflow_dispatch:

jobs:
  export:
    name: Export badge-db to R2
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BACKUP }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export D1 and upload to R2
        working-directory: apps/worker
        env:
          R2_BACKUP_ACCESS_KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY }}
          R2_BACKUP_SECRET_KEY: ${{ secrets.R2_BACKUP_SECRET_KEY }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: badge-db-backups
        run: |
          FILE="d1_$(date +%Y%m%d_%H%M%S).sql"
          pnpm exec wrangler d1 export badge-db --remote --env production --output "$FILE"
          gzip -f "$FILE"
          FILE="$FILE.gz"

          CONTENT_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$R2_BACKUP_ACCESS_KEY:$R2_BACKUP_SECRET_KEY" \
            -H "x-amz-content-sha256: $CONTENT_SHA256" \
            --data-binary @"$FILE" \
            "$R2_BACKUP_ENDPOINT/$R2_BACKUP_BUCKET/$FILE")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "R2 upload failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Uploaded $FILE ($(du -h "$FILE" | cut -f1))"

      # Dry run of the 90-day retention the privacy policy promises: lists the
      # d1_ dumps and writes to the run summary which ones a lifecycle rule
      # would delete. Deletes nothing and never fails the job, so it sends no
      # email. Once the real R2 rule on d1_ is on, it shows what it removed.
      - name: Report d1_ dumps past the 90-day retention (dry run)
        if: always()
        continue-on-error: true
        env:
          R2_BACKUP_ACCESS_KEY: ${{ secrets.R2_BACKUP_ACCESS_KEY }}
          R2_BACKUP_SECRET_KEY: ${{ secrets.R2_BACKUP_SECRET_KEY }}
          R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BACKUP_BUCKET: badge-db-backups
          RETENTION_DAYS: "90"
        run: |
          python3 - <<'PY'
          import datetime, os, subprocess, urllib.parse, xml.etree.ElementTree as ET

          ns = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}
          empty_sha = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          base = f"{os.environ['R2_BACKUP_ENDPOINT']}/{os.environ['R2_BACKUP_BUCKET']}"
          days = int(os.environ["RETENTION_DAYS"])
          now = datetime.datetime.now(datetime.timezone.utc)

          objects, token = [], None
          while True:
              query = {"list-type": "2", "prefix": "d1_"}
              if token:
                  query["continuation-token"] = token
              body = subprocess.run(
                  ["curl", "-sf", "--aws-sigv4", "aws:amz:auto:s3",
                   "--user", f"{os.environ['R2_BACKUP_ACCESS_KEY']}:{os.environ['R2_BACKUP_SECRET_KEY']}",
                   "-H", f"x-amz-content-sha256: {empty_sha}",
                   f"{base}?{urllib.parse.urlencode(query)}"],
                  capture_output=True, text=True, check=True).stdout
              root = ET.fromstring(body)
              for item in root.findall("s3:Contents", ns):
                  modified = datetime.datetime.fromisoformat(
                      item.find("s3:LastModified", ns).text.replace("Z", "+00:00"))
                  objects.append((item.find("s3:Key", ns).text, modified))
              if root.findtext("s3:IsTruncated", namespaces=ns) != "true":
                  break
              token = root.findtext("s3:NextContinuationToken", namespaces=ns)

          expired = [(k, m) for k, m in objects if (now - m).days >= days]
          lines = [f"### d1_ retention dry run ({days} days)", "",
                   f"- d1_ dumps in the bucket: {len(objects)}",
                   f"- would be deleted today: {len(expired)}"]
          if objects:
              oldest_key, oldest = min(objects, key=lambda o: o[1])
              first_due = (oldest + datetime.timedelta(days=days)).date()
              lines.append(f"- oldest: `{oldest_key}` ({(now - oldest).days} days), due on {first_due}")
          lines += [f"  - `{k}` ({(now - m).days} days)" for k, m in expired]

          report = "\n".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report + "\n")
          PY
