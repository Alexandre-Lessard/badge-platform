name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Production: the Cloudflare Worker behind api.badgeid.ca, on D1.
  deploy-worker:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    name: Deploy API Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @badge/shared build

      - name: Apply D1 migrations
        run: pnpm --filter @badge/worker exec wrangler d1 migrations apply badge-db --remote --env production

      - name: Deploy Worker
        run: pnpm --filter @badge/worker exec wrangler deploy --env production

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            if curl -sf https://api.badgeid.ca/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying..."
          done
          echo "Health check failed!"
          exit 1

  # Web: the SPA on Cloudflare Pages.
  deploy-web:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    name: Deploy Web
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @badge/shared build

      - name: Build web
        env:
          VITE_API_URL: https://api.badgeid.ca/api
        run: pnpm --filter @badge/web build

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter @badge/web exec wrangler pages deploy build/client --project-name badge-platform --branch main

  # Legacy: the old Fastify server, kept alive only to serve the argon2 bridge
  # the Worker calls (POST /api/internal/verify-legacy on api.rnbp.ca). Every
  # other path on that host is refused by the tunnel. Delete this job — and the
  # server — once no user row still has a $argon2 hash.
  deploy-legacy-bridge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    name: Deploy legacy argon2 bridge
    runs-on: [self-hosted, rnbp-prod]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Pin to main, never check out the SHA that triggered the run.
          # This prevents a malicious commit from ever landing on the runner.
          ref: main

      - name: Sync working tree to /opt/rnbp/repo
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.deploy.env' \
            ./ /opt/rnbp/repo/

      - name: Install, build and restart
        run: |
          source ~/.nvm/nvm.sh
          cd /opt/rnbp/repo
          pnpm install --frozen-lockfile
          pnpm --filter @badge/shared build
          pnpm --filter @badge/api build
          sudo systemctl restart rnbp-api

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            sleep 3
            if curl -sf http://localhost:3000/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying..."
          done
          echo "Health check failed!"
          exit 1
